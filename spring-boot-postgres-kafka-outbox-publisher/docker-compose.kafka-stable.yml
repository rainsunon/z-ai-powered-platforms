# ✅ Kafka KRaft (Confluent cp-kafka 8.x) - stable, non-hanging config
# Based on Confluent's documented "cp-kafka KRaft combined mode" pattern:
# - Uses PLAINTEXT (internal) + PLAINTEXT_HOST (host) + CONTROLLER
# - Does NOT override entrypoint (lets Confluent scripts format/boot correctly)
# - Sets hostname to match listener hostnames
#
# Host ports (keep your setup):
#   Postgres: localhost:5453
#   Kafka:    localhost:9096
#
# If you previously tried other KRaft configs, do a clean reset once:
#   docker compose -f docker-compose.kafka-stable.yml down -v
#   docker compose -f docker-compose.kafka-stable.yml up -d
#
# Optional UI:
#   docker compose -f docker-compose.kafka-stable.yml --profile ui up -d

name: outbox-publisher-demo

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: outbox_demo
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    ports:
      - "5453:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_demo"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pg-outbox:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:8.0.0.amd64
    container_name: kafkaoutbox
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9096:9092"     # host -> container (PLAINTEXT_HOST)
    environment:
      # ---- KRaft required ----
      CLUSTER_ID: "k8iw7ALCQ4GgieICuiz1eQ"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # ---- listeners (Confluent recommended pattern) ----
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9096"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # ---- single-node requirements ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - kafka-outbox:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:8.0.0.amd64
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - bash
      - -ec
      - |
        bs="kafka:29092"
        topic="domain-events"
        kafka-topics --bootstrap-server "$bs" --create --if-not-exists           --topic "$topic" --partitions 3 --replication-factor 1
    restart: "no"

  kafka-ui:
    profiles: ["ui"]
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg-outbox:
  kafka-outbox:
