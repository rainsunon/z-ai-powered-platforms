spring:
  application:
    name: auth-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      routes:
        # Rent Service Routes
        - id: rent-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/rent/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: CircuitBreaker
              args:
                name: rentServiceCircuitBreaker
                fallbackUri: forward:/fallback/rent
        
        # Buy Service Routes
        - id: buy-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/buy/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: CircuitBreaker
              args:
                name: buyServiceCircuitBreaker
                fallbackUri: forward:/fallback/buy
        
        # Search Service Routes
        - id: search-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
            - name: CircuitBreaker
              args:
                name: searchServiceCircuitBreaker
                fallbackUri: forward:/fallback/search
        
        # Analytics Service Routes
        - id: analytics-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 15
                redis-rate-limiter.burstCapacity: 30
            - name: CircuitBreaker
              args:
                name: analyticsServiceCircuitBreaker
                fallbackUri: forward:/fallback/analytics
        
        # Audit Service Routes
        - id: audit-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 15
                redis-rate-limiter.burstCapacity: 30
            - name: CircuitBreaker
              args:
                name: auditServiceCircuitBreaker
                fallbackUri: forward:/fallback/audit
        
        # Favorite Service Routes
        - id: favorite-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/favorites/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
            - name: CircuitBreaker
              args:
                name: favoriteServiceCircuitBreaker
                fallbackUri: forward:/fallback/favorites
        
        # Photo Service Routes
        - id: photo-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/photos/**
          filters:
            - StripPrefix=2
            - name: RateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
            - name: CircuitBreaker
              args:
                name: photoServiceCircuitBreaker
                fallbackUri: forward:/fallback/photos
      
      # Circuit Breaker Configuration
      resilience4j:
        circuitbreaker:
          configs:
            default:
              failure-rate-threshold: 50
              wait-duration-in-open-state: 5s
              sliding-window-size: 10
              minimum-number-of-calls: 5
          instances:
            rentServiceCircuitBreaker:
              base-config: default
            buyServiceCircuitBreaker:
              base-config: default
            searchServiceCircuitBreaker:
              base-config: default
            analyticsServiceCircuitBreaker:
              base-config: default
            auditServiceCircuitBreaker:
              base-config: default
            favoriteServiceCircuitBreaker:
              base-config: default
            photoServiceCircuitBreaker:
              base-config: default
      
      # Rate Limiter Configuration
      redis:
        host: localhost
        port: 6379
        database: 0

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
