version: '3.8'

services:
  rent-service:
    build:
      context: ./backend/rent-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - rent-service-db
      - keycloak
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://rent-service-db:5432/rent_service
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/immo-finder
    networks:
      - immo-network

  rent-service-db:
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rent_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - immo-network

  keycloak-db:
    image: postgres:latest
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - immo-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    depends_on:
      - keycloak-db
    networks:
      - immo-network
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  # --- Infrastructure ---
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    networks:
      - immo-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - immo-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - immo-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - immo-network

  # --- Databases ---
  buy-service-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=buy_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - immo-network

  # --- Microservices ---
  buy-service:
    build:
      context: ./backend/buy-service
    ports:
      - "8083:8080"
    depends_on:
      - buy-service-db
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://buy-service-db:5432/buy_service
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - immo-network

  search-service:
    build:
      context: ./backend/search-service
    ports:
      - "8084:8080"
    depends_on:
      - elasticsearch
      - kafka
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - immo-network

  auth-gateway:
    build:
      context: ./backend/auth-gateway
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - keycloak
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/immo-finder
    networks:
      - immo-network

  audit-service:
    build:
      context: ./backend/audit-service
    ports:
      - "8085:8080"
    depends_on:
      - mongodb
      - kafka
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/audit_service
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - immo-network

networks:
  immo-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data: 