apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-ml-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-ml-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort | default .Values.service.port }}
    protocol: TCP
    name: http
  selector:
    {{- include "ai-ml-service.selectorLabels" . | nindent 4 }}
