apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-in-production"
  MONGODB_USERNAME: "mongo"
  MONGODB_PASSWORD: "change-me-in-production"
  
  # Keycloak credentials
  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "change-me-in-production"
  KEYCLOAK_CLIENT_SECRET: "change-me-in-production"
  
  # JWT Secret
  JWT_SECRET: "change-me-in-production-use-long-random-string"
  
  # Email configuration
  SPRING_MAIL_USERNAME: "your-email@example.com"
  SPRING_MAIL_PASSWORD: "your-email-password"
  
  # Payment gateway credentials
  STRIPE_API_KEY: "sk_test_your-stripe-key"
  PAYPAL_CLIENT_ID: "your-paypal-client-id"
  PAYPAL_CLIENT_SECRET: "your-paypal-client-secret"
