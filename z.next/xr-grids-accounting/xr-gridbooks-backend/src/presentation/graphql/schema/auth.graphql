scalar DateTime
scalar JSON

type User {
  id: ID!
  email: String!
  name: String!
  createdAt: DateTime!
}

type AuthPayload {
  user: User!
  token: String!
}

input SignUpInput {
  email: String!
  password: String!
  name: String!
}

input SignInInput {
  email: String!
  password: String!
}

type Query {
  me: User
}

type Mutation {
  signUp(input: SignUpInput!): AuthPayload!
  signIn(input: SignInInput!): AuthPayload!
}
