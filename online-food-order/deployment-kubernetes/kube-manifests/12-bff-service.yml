apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  labels:
    app: bff-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
      - name: bff-service
        image: ofo/bff-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8091
        env:
        - name: USER_SERVICE_URL
          value: "http://user-service:8083"
        - name: RESTAURANT_SERVICE_URL
          value: "http://restaurant-service:8082"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8081"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8084"
        - name: SEARCH_SERVICE_URL
          value: "http://search-service:8085"
        - name: REVIEW_SERVICE_URL
          value: "http://review-service:8086"
        - name: BILLING_SERVICE_URL
          value: "http://billing-service:8088"
        - name: INVOICE_SERVICE_URL
          value: "http://invoice-service:8090"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:5173,https://ofo-frontend.vercel.app"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8091
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8091
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  labels:
    app: bff-service
spec:
  type: ClusterIP
  ports:
  - port: 8091
    targetPort: 8091
    protocol: TCP
  selector:
    app: bff-service

