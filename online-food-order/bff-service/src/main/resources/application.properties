# Application Configuration
server.port=8091
spring.application.name=bff-service

# Upstream Services URLs
service.user.url=${USER_SERVICE_URL:http://localhost:8083}
service.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8082}
service.order.url=${ORDER_SERVICE_URL:http://localhost:8081}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
service.search.url=${SEARCH_SERVICE_URL:http://localhost:8085}
service.review.url=${REVIEW_SERVICE_URL:http://localhost:8086}
service.billing.url=${BILLING_SERVICE_URL:http://localhost:8088}
service.invoice.url=${INVOICE_SERVICE_URL:http://localhost:8090}

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50

# WebClient Configuration
spring.webflux.client.connect-timeout=5000
spring.webflux.client.read-timeout=5000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Tracing
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

