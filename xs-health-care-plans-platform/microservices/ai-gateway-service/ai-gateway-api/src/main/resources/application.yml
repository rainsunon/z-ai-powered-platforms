spring:
  application:
    name: ai-gateway-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local

opensearch:
  endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index: plans_collection

aws:
  bedrock:
    region: ${AWS_REGION:us-east-1}
    embedding-model: amazon.titan-embed-text-v2:0
    llm-model: anthropic.claude-3-sonnet-20240229-v1:0

rag:
  similarity-threshold: 0.3
  mmr:
    k: 6
    fetch-k: 18
    lambda: 0.7
  abstention:
    min-evidence-count: 2
    high-confidence-threshold: 0.5

logging:
  level:
    com.healthcare.ai: DEBUG
    org.opensearch: INFO
    software.amazon.awssdk: INFO
