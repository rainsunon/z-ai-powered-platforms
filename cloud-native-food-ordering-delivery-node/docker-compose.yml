version: '3.8'

services:
  # API Gateway Service
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=3000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - redis
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Rate Limiter Service
  rate-limiter:
    build:
      context: ./rate-limiter-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rate_limiter
      - REDIS_URL=redis://redis:6379
      - ADMIN_KEY=${ADMIN_KEY:-admin-secret-key}
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # Authentication Service
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/auth}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-jwt-refresh-secret-key-develop-only}
    depends_on:
      - redis
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  # Orders Service
  orders:
    build:
      context: ./orders
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/orders}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - AUTH_SERVICE_URL=http://auth:5001
    depends_on:
      - redis
      - mongo
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Restaurants Service
  restaurants:
    build:
      context: ./food-delivery-restuarant-web
      dockerfile: Dockerfile
    ports:
      - "5006:5006"
    environment:
      - NODE_ENV=production
      - PORT=5006
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/restaurants}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - AUTH_SERVICE_URL=http://auth:5001
      - ORDER_SERVICE_URL=http://orders:5002
      depends_on:
      - redis
      - mongo
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Payments Service
  payments:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - PORT=5005
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/payments}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - AUTH_SERVICE_URL=http://auth:5001
      - ORDER_SERVICE_URL=http://orders:5002
      depends_on:
      - redis
      - mongo
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Notifications Service
  notifications:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "5007:5007"
    environment:
      - NODE_ENV=production
      - PORT=5007
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/notifications}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - AUTH_SERVICE_URL=http://auth:5001
      depends_on:
      - redis
      - mongo
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Admin Service
  admin:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    ports:
      - "5008:5008"
    environment:
      - NODE_ENV=production
      - PORT=5008
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/admin}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-develop-only}
      - AUTH_SERVICE_URL=http://auth:5001
      - ORDER_SERVICE_URL=http://orders:5002
      - RESTAURANT_SERVICE_URL=http://restaurants:5006
      - PAYMENT_SERVICE_URL=http://payments:5005
      - NOTIFICATION_SERVICE_URL=http://notifications:5007
      depends_on:
      - redis
      - mongo
      - auth
    networks:
      - app-network
    restart: unless-stopped

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (for rate limiter rules)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=rate_limiter
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (for data persistence)
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app-network
    restart: unless-stopped

  # Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=true
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_provisioning:/etc/grafana/provisioning
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "5775:5775"
      - "6831:6831/udp"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=9411
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - app-network
    restart: unless-stopped

  # Volumes
volumes:
  redis_data:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

# Networks
networks:
  app-network:
    driver: bridge

# Environment Variables (Set these in your .env file or pass when running)
# JWT_SECRET: Secret key for JWT token signing
# JWT_REFRESH_SECRET: Secret key for JWT refresh token signing
# MONGO_URI: MongoDB connection string
# POSTGRES_PASSWORD: PostgreSQL password
# ADMIN_KEY: Admin key for rate limiter management
# GF_SECURITY_ADMIN_PASSWORD: Grafana admin password
