apiVersion: v2
name: ecommerce
description: E-commerce Microservices Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: common
    version: "1.0.0"
    repository: "file://charts/common"
  - name: discovery-service
    version: "1.0.0"
    repository: "file://charts/discovery-service"
    condition: discovery-service.enabled
  - name: api-gateway
    version: "1.0.0"
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled
  - name: user-service
    version: "1.0.0"
    repository: "file://charts/user-service"
    condition: user-service.enabled
  - name: product-service
    version: "1.0.0"
    repository: "file://charts/product-service"
    condition: product-service.enabled
  - name: order-service
    version: "1.0.0"
    repository: "file://charts/order-service"
    condition: order-service.enabled
  - name: payment-service
    version: "1.0.0"
    repository: "file://charts/payment-service"
    condition: payment-service.enabled
  - name: inventory-service
    version: "1.0.0"
    repository: "file://charts/inventory-service"
    condition: inventory-service.enabled
  - name: favourite-service
    version: "1.0.0"
    repository: "file://charts/favourite-service"
    condition: favourite-service.enabled
  - name: rating-service
    version: "1.0.0"
    repository: "file://charts/rating-service"
    condition: rating-service.enabled
  - name: promotion-service
    version: "1.0.0"
    repository: "file://charts/promotion-service"
    condition: promotion-service.enabled
  - name: media-service
    version: "1.0.0"
    repository: "file://charts/media-service"
    condition: media-service.enabled
  - name: notification-service
    version: "1.0.0"
    repository: "file://charts/notification-service"
    condition: notification-service.enabled
  - name: search-service
    version: "1.0.0"
    repository: "file://charts/search-service"
    condition: search-service.enabled
  - name: shipping-service
    version: "1.0.0"
    repository: "file://charts/shipping-service"
    condition: shipping-service.enabled
  - name: tax-service
    version: "1.0.0"
    repository: "file://charts/tax-service"
    condition: tax-service.enabled
  - name: analytics-service
    version: "1.0.0"
    repository: "file://charts/analytics-service"
    condition: analytics-service.enabled
  - name: ai-ml-service
    version: "1.0.0"
    repository: "file://charts/ai-ml-service"
    condition: ai-ml-service.enabled
