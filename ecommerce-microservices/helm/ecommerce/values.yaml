# Global values
global:
  imagePullPolicy: IfNotPresent
  imageRegistry: ecommerce
  environment: dev
  namespace: ecommerce

# Common configuration
common:
  enabled: true

# Discovery Service
discovery-service:
  enabled: true
  replicaCount: 1
  image:
    repository: ecommerce/discovery-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8761
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  env:
    - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
      value: "false"
    - name: EUREKA_CLIENT_FETCH_REGISTRY
      value: "false"
    - name: EUREKA_INSTANCE_HOSTNAME
      value: "discovery-service"
    - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
      value: "true"

# API Gateway
api-gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ecommerce/api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

