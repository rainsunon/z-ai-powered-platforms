replicaCount: 2

image:
  repository: ecommerce/ai-ml-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8094
  targetPort: 8094

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka:9092"

nodeSelector: {}
affinity: {}
tolerations: []
