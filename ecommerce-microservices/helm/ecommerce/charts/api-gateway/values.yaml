# Default values for api-gateway
replicaCount: 2

image:
  repository: ecommerce/api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  annotations: {}
  loadBalancerIP: ""
  sessionAffinity: None

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
affinity: {}
tolerations: []
podAnnotations: {}
