server:
  port: 8093

spring:
  application:
    name: ANALYTICS-SERVICE

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org:
      springframework:
        web: INFO