# Saga Recovery and Monitoring Configuration

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,saga,dlq
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging configuration for saga operations
logging.level.com.xrs.orderservice.service.OrderSagaOrchestrator=DEBUG
logging.level.com.xrs.orderservice.service.SagaRecoveryService=INFO
logging.level.com.xrs.orderservice.service.DeadLetterQueueService=INFO
logging.level.com.xrs.orderservice.event.EventConsumer=DEBUG

# Distributed Tracing (if using Zipkin/Jaeger)
# spring.zipkin.base-url=http://localhost:9411
# spring.sleuth.sampler.probability=1.0
# management.tracing.sampling.probability=1.0

# Kafka consumer configuration for saga events
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=10

# Database pool monitoring
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Saga recovery job configuration (runs every 5 minutes)
# Configured in SagaRecoveryService @Scheduled annotation

# Dead Letter Queue configuration
# Max retries before sending to DLQ: 3 (configured in DeadLetterQueueService)
